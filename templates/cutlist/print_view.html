<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutlist Report — {{ project.name }}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/cutlist.css' %}">
  <style>
    /* ── Screen preview ──────────────────────────────────────── */
    body {
      background: #f0ede8;
      padding: 2cm 0;
      font-size: 13px;
    }

    .print-page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 24px auto;
      padding: 2cm;
      box-sizing: border-box;
      box-shadow: 0 2px 10px rgba(26,10,0,.12);
    }

    /* ── Job header ──────────────────────────────────────────── */
    .print-header {
      border-bottom: 2px solid var(--brown);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .print-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 .6rem 0;
      color: var(--brown);
      letter-spacing: .02em;
    }
    .print-meta-grid {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: .2rem .75rem;
      font-size: 0.8rem;
    }
    .print-meta-label { color: #888; font-weight: 600; }

    /* ── Section headings ────────────────────────────────────── */
    .print-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #999;
      margin: 1.5rem 0 .5rem 0;
      padding-bottom: .25rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Tables (overview + stock order) ────────────────────── */
    .print-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .print-table thead th {
      background: var(--brown);
      color: white;
      font-weight: 600;
      padding: .35rem .65rem;
      text-align: left;
    }
    .print-table thead th:not(:first-child) { text-align: right; }
    .print-table td {
      padding: .3rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .print-table td:not(:first-child) { text-align: right; }
    .print-table tr:last-child td { border-bottom: none; }
    .print-table tbody tr:nth-child(even) td { background: var(--tan-bg); }
    .print-table tfoot td {
      font-weight: 700;
      border-top: 2px solid var(--border);
      background: var(--tan-bg);
    }

    /* Stock order table: thead repeats when table spans pages */
    .print-stock-table thead { display: table-header-group; }
    .print-stock-table tr    { page-break-inside: avoid; }

    /* ── Diagram page header ─────────────────────────────────── */
    .print-page-header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      border-bottom: 2px solid var(--brown);
      padding-bottom: .5rem;
      margin-bottom: 1rem;
    }
    .print-page-header__member {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown);
    }
    .print-page-header__group {
      font-size: 0.82rem;
      color: #666;
    }
    .print-page-header__jobref {
      margin-left: auto;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* ── Pattern summary table (one row per distinct cutting pattern,       ── */
    /* ── replaces Genia's per-layout box — same facts, no per-layout repeat) */
    .print-pattern-table { margin-bottom: 1.25rem; }

    /* ── Per-pattern cut legend (ID/length/mark/qty) — every diagram segment ── */
    /* ── below is labelled with just its ID, since a narrow offcut has no    ── */
    /* ── room for full mm+mark text; see static/js/cutting_report.js.        ── */
    .print-cut-legend { margin: .4rem 0 .6rem 0; }
    .print-cut-legend th, .print-cut-legend td { padding: .2rem .65rem; }
    /* Mark is text, not a number — override the table's default "every column
       but the first is numeric" alignment rule for this one column. */
    .print-cut-legend th:nth-child(3), .print-cut-legend td:nth-child(3) { text-align: left; }
    .print-cut-legend__waste td { color: #999; font-style: italic; }

    /* ── Horizontal cutting diagrams — wide bars stacked down the page,     ── */
    /* ── instead of narrow tall sticks wrapped side by side, to cut white   ── */
    /* ── space and give cut labels room to sit inline.                     ── */
    .h-diagrams-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .h-diagram__header {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: .25rem;
    }
    .h-diagram__header strong { color: var(--brown); font-size: 0.85rem; }
    .h-stick {
      display: flex;
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .h-stick .cut-segment,
    .h-stick .cut-segment-split,
    .h-stick .waste-segment {
      min-height: 0;
      height: 100%;
      flex-direction: column;
      border-bottom: none;
      border-top: none;
      border-right: 2px solid white;
      font-size: 0.66rem;
      line-height: 1.15;
      padding: 0 .25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .h-stick > *:last-child { border-right: none; }
    .h-seg-letter { font-size: 0.95rem; font-weight: 700; color: rgba(0,0,0,.65); }
    /* Subtler than the bright red/pink cutlist.css uses for the live Step 4 editor (where
       waste needs to grab attention while working) — this is a finished, printable report,
       so leftover material just needs to read as "spare", not "warning". */
    .h-stick .waste-segment { background: var(--tan-bg); border-top: none; color: #999; }

    /* ── Per-group stats bar ─────────────────────────────────── */
    .print-group-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
      margin-top: 1rem;
      padding: .65rem;
      background: var(--tan-bg);
      border-top: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .print-group-stats .stat { text-align: center; }

    /* ── Print media ─────────────────────────────────────────── */
    @media print {
      body { background: white; padding: 0; margin: 0; }

      .print-page {
        box-shadow: none;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 0;
      }

      .print-page--diagram { break-before: page; }

      /* Stock table header repeats across physical pages */
      .print-stock-table thead { display: table-header-group; }
      .print-stock-table tr    { page-break-inside: avoid; }

      .stick-diagram        { page-break-inside: avoid; break-inside: avoid; }
      .diagrams-container   { page-break-inside: auto; }
      .h-diagram            { page-break-inside: avoid; break-inside: avoid; }
      .h-diagrams-container { page-break-inside: auto; }
      .print-pattern-table tr { page-break-inside: avoid; }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      @page { margin: 1.5cm; size: A4; }
    }
  </style>
</head>
<body>

  <div id="print-root"></div>

  {{ project.state|json_script:"print-state-data" }}
  <script>
    window.CUTLIST_PRINT_MODE = true;
    window.CUTLIST_PROJECT_INFO = {
      name: "{{ project.name|escapejs }}",
      lbRef: "{{ project.project.lb_ref|escapejs }}",
      clientName: "{{ project.project.client_name|escapejs }}",
      siteAddress: "{{ project.project.site_address|escapejs }}",
      merchantReference: "{{ project.project.merchant_reference|escapejs }}"
    };
    (function () {
      const el = document.getElementById('print-state-data');
      window.CUTLIST_STATE = el ? JSON.parse(el.textContent) : null;
    })();
  </script>
  <script src="{% static 'js/cutlist.js' %}"></script>
  <script src="{% static 'js/cutting_report.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const root = document.getElementById('print-root');

      if (!window.CUTLIST_STATE || !window.CUTLIST_STATE.tabs || !window.CUTLIST_STATE.tabs.length) {
        root.innerHTML = '<p style="padding:2cm;font-family:sans-serif">No saved data found. Please save the project before printing.</p>';
        return;
      }

      // Populate project state without touching wizard DOM
      const state = window.CUTLIST_STATE;
      Object.assign(project.jobDetails, state.jobDetails || {});
      project.tabs  = [];
      tabCounter    = 0;
      binIdCounter  = 0;

      state.tabs.forEach(tabData => {
        const tabId = `tab-${tabCounter++}`;
        const tab = {
          id:                   tabId,
          memberName:           tabData.memberName,
          productId:            tabData.productId ?? null,
          cuts:                 tabData.cuts,
          stockLengths:         tabData.stockLengths,
          cutTolerance:         tabData.cutTolerance !== undefined ? tabData.cutTolerance : 50,
          overlengthSplitStock: tabData.overlengthSplitStock || 6000,
          results:              tabData.results || null,
        };
        if (tab.results && tab.results.bins) {
          tab.results.bins.forEach(bin => {
            if (bin.id === undefined) bin.id = binIdCounter++;
          });
        }
        project.tabs.push(tab);
      });

      root.appendChild(buildSummaryPage());
      buildDiagramPages().forEach(page => root.appendChild(page));

      setTimeout(() => window.print(), 600);
    });

    // ─── Summary page ─────────────────────────────────────────────

    function buildSummaryPage() {
      const jd   = project.jobDetails;
      const info = window.CUTLIST_PROJECT_INFO || {};
      const tabs = project.tabs.filter(t => t.results);
      const today = new Date().toLocaleDateString('en-AU', {
        day: '2-digit', month: 'short', year: 'numeric'
      });

      const page = document.createElement('div');
      page.className = 'print-page print-page--summary';
      page.innerHTML = `
        <div class="print-header">
          <h1>Cutlist Optimisation Report</h1>
          <div class="print-meta-grid">
            <span class="print-meta-label">Job:</span>          <span>${escReportText(info.lbRef)}</span>
            <span class="print-meta-label">Client:</span>        <span>${escReportText(info.clientName)}</span>
            <span class="print-meta-label">Site:</span>          <span>${escReportText(info.siteAddress)}</span>
            <span class="print-meta-label">Reference:</span>    <span>${escReportText(info.merchantReference)}</span>
            <span class="print-meta-label">Prepared by:</span>  <span>${escReportText(jd.preparedBy)}</span>
            <span class="print-meta-label">Date:</span>          <span>${today}</span>
            <span class="print-meta-label">Kerf width:</span>   <span>${jd.kerfWidth}mm</span>
          </div>
        </div>
        <div class="print-section-title">Optimisation Overview</div>
        ${buildOverviewTable(tabs)}
        <div class="print-section-title">Stock Order</div>
        ${buildStockTable(tabs)}
      `;
      return page;
    }

    function buildOverviewTable(tabs) {
      if (!tabs.length) return '<p>No optimised results found.</p>';

      let totalSticks    = 0;
      let totalStockMm   = 0;
      let totalCutMm     = 0;
      let totalWasteMm   = 0;

      const rows = tabs.map(tab => {
        const r = tab.results;
        totalSticks  += r.stockCount;
        totalStockMm += r.totalStockUsed;
        totalCutMm   += r.totalCutLength;
        totalWasteMm += Number(r.totalWaste);
        return `<tr>
          <td>${escReportText(tab.memberName)}</td>
          <td>${r.stockCount}</td>
          <td>${(r.totalStockUsed / 1000).toFixed(1)}</td>
          <td>${(r.totalCutLength  / 1000).toFixed(1)}</td>
          <td>${r.wastePercentage}%</td>
        </tr>`;
      }).join('');

      const totalWastePct = totalStockMm > 0
        ? ((totalWasteMm / totalStockMm) * 100).toFixed(1)
        : '0.0';

      return `<table class="print-table">
        <thead>
          <tr>
            <th>Member Type</th>
            <th style="text-align:right">Sticks</th>
            <th style="text-align:right">Stock (lin. m)</th>
            <th style="text-align:right">Cut Length (m)</th>
            <th style="text-align:right">Waste %</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>${totalSticks}</td>
            <td>${(totalStockMm / 1000).toFixed(1)}</td>
            <td>${(totalCutMm   / 1000).toFixed(1)}</td>
            <td>${totalWastePct}%</td>
          </tr>
        </tfoot>
      </table>`;
    }

    function buildStockTable(tabs) {
      if (!tabs.length) return '';

      const stockData = [];
      tabs.forEach(tab => {
        const counts = {};
        tab.results.bins.forEach(bin => {
          const group  = bin.group || '';
          const length = bin.stockLength / 1000;
          const key    = `${group}||${length}`;
          counts[key]  = (counts[key] || 0) + 1;
        });
        Object.entries(counts).forEach(([key, qty]) => {
          const [group, lenStr] = key.split('||');
          stockData.push({ group, product: tab.memberName, length: parseFloat(lenStr), qty });
        });
      });

      stockData.sort((a, b) => {
        const ga = a.group || '￿';
        const gb = b.group || '￿';
        if (ga !== gb) return ga.localeCompare(gb);
        if (a.product !== b.product) return a.product.localeCompare(b.product);
        return b.length - a.length;
      });

      const hasGroups = stockData.some(r => r.group);
      const rows = stockData.map(row => `<tr>
        ${hasGroups ? `<td>${escReportText(row.group || '—')}</td>` : ''}
        <td>${escReportText(row.product)}</td>
        <td>${row.length.toFixed(1)}</td>
        <td>${row.qty}</td>
      </tr>`).join('');

      const totalQty = stockData.reduce((s, r) => s + r.qty, 0);
      const totalFooter = `<tr>
        ${hasGroups ? '<td></td>' : ''}
        <td>Total</td>
        <td></td>
        <td>${totalQty}</td>
      </tr>`;

      return `<table class="print-table print-stock-table">
        <thead>
          <tr>
            ${hasGroups ? '<th>Group</th>' : ''}
            <th>Product</th>
            <th style="text-align:right">Length (m)</th>
            <th style="text-align:right">Qty</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>${totalFooter}</tfoot>
      </table>`;
    }

    // ─── Diagram pages ────────────────────────────────────────────

    function buildDiagramPages() {
      const pages  = [];
      const info   = window.CUTLIST_PROJECT_INFO || {};
      const jobRef = [info.lbRef, info.name].filter(Boolean).join(' — ');

      project.tabs.filter(t => t.results).forEach(tab => {
        const { bins, kerfWidth } = tab.results;

        const groupOrder = [...new Set(bins.map(b => b.group || ''))].sort((a, b) => {
          if (a === '') return 1;
          if (b === '') return -1;
          return a.localeCompare(b);
        });
        const hasNamedGroups = groupOrder.some(k => k !== '');

        groupOrder.forEach(groupKey => {
          const groupBins = bins
            .filter(b => (b.group || '') === groupKey)
            .sort((a, b) => b.stockLength - a.stockLength || a.remaining - b.remaining);

          if (!groupBins.length) return;

          const groupLabel = groupKey
            ? groupKey
            : (hasNamedGroups ? 'Ungrouped' : null);

          // Per-group stats
          const stockTotal = groupBins.reduce((s, b) => s + b.stockLength, 0);
          const wasteTotal = groupBins.reduce((s, b) => s + (b.remaining || 0), 0);
          const cutTotal   = groupBins.reduce((s, b) =>
            s + b.cuts.reduce((cs, c) => cs + (typeof c === 'object' ? c.length : c), 0), 0);
          const wastePct   = stockTotal > 0
            ? ((wasteTotal / stockTotal) * 100).toFixed(1)
            : '0.0';

          const page = document.createElement('div');
          page.className = 'print-page print-page--diagram';

          const groupSubtitle = groupLabel
            ? `<span class="print-page-header__group">Group: ${escReportText(groupLabel)}</span>`
            : '';

          // Collapse physical sticks into distinct cutting patterns — a job can
          // easily produce dozens of sticks that are really only a handful of
          // repeated patterns. A wee summary table (one row per pattern) carries
          // the per-stick facts once, instead of Genia's repeated per-layout box,
          // and the horizontal diagrams below just show where things sit.
          const layouts = groupIdenticalLayouts(groupBins);

          page.innerHTML = `
            <div class="print-page-header">
              <span class="print-page-header__member">${escReportText(tab.memberName)}</span>
              ${groupSubtitle}
              <span class="print-page-header__jobref">${escReportText(jobRef)}</span>
            </div>
            ${buildPatternSummaryTable(layouts, kerfWidth)}
            <div class="h-diagrams-container"></div>
            <div class="print-group-stats">
              <div class="stat">
                <div class="stat-label">Sticks</div>
                <div class="stat-value">${groupBins.length}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Stock (lin. m)</div>
                <div class="stat-value">${(stockTotal / 1000).toFixed(1)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Cut Length</div>
                <div class="stat-value">${(cutTotal / 1000).toFixed(1)}m</div>
              </div>
              <div class="stat">
                <div class="stat-label">Waste</div>
                <div class="stat-value">${wastePct}%</div>
              </div>
            </div>`;

          const container = page.querySelector('.h-diagrams-container');
          layouts.forEach((layout, i) => {
            container.insertAdjacentHTML(
              'beforeend',
              generateHorizontalDiagram(layout.representative, `Pattern ${i + 1}`, layout.count)
            );
          });

          pages.push(page);
        });
      });

      return pages;
    }
  </script>
</body>
</html>
