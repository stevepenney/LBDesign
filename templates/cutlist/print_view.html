<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutlist Report — {{ project.name }}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/cutlist.css' %}">
  <style>
    /* ── Screen preview ──────────────────────────────────────── */
    body {
      background: #f0ede8;
      padding: 2cm 0;
      font-size: 13px;
    }

    .print-page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 24px auto;
      padding: 2cm;
      box-sizing: border-box;
      box-shadow: 0 2px 10px rgba(26,10,0,.12);
    }

    /* ── Job header ──────────────────────────────────────────── */
    .print-header {
      border-bottom: 2px solid var(--brown);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .print-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 .6rem 0;
      color: var(--brown);
      letter-spacing: .02em;
    }
    .print-meta-grid {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: .2rem .75rem;
      font-size: 0.8rem;
    }
    .print-meta-label { color: #888; font-weight: 600; }

    /* ── Section headings ────────────────────────────────────── */
    .print-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #999;
      margin: 1.5rem 0 .5rem 0;
      padding-bottom: .25rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Tables (overview + stock order) ────────────────────── */
    .print-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .print-table thead th {
      background: var(--brown);
      color: white;
      font-weight: 600;
      padding: .35rem .65rem;
      text-align: left;
    }
    .print-table thead th:not(:first-child) { text-align: right; }
    .print-table td {
      padding: .3rem .65rem;
      border-bottom: 1px solid var(--border);
    }
    .print-table td:not(:first-child) { text-align: right; }
    .print-table tr:last-child td { border-bottom: none; }
    .print-table tbody tr:nth-child(even) td { background: var(--tan-bg); }
    .print-table tfoot td {
      font-weight: 700;
      border-top: 2px solid var(--border);
      background: var(--tan-bg);
    }

    /* Stock order table: thead repeats when table spans pages */
    .print-stock-table thead { display: table-header-group; }
    .print-stock-table tr    { page-break-inside: avoid; }

    /* Elevations table has text (not numeric) in its non-first columns */
    .print-elevations-table th:nth-child(2), .print-elevations-table td:nth-child(2),
    .print-elevations-table th:nth-child(6), .print-elevations-table td:nth-child(6) {
      text-align: left;
    }

    /* ── Order sheet total line ──────────────────────────────── */
    .print-order-total {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: .75rem;
      margin-top: .5rem;
      padding-top: .75rem;
      border-top: 2px solid var(--brown);
    }
    .print-order-total__note {
      margin-right: auto;
      font-size: 0.72rem;
      color: #b27000;
      font-style: italic;
    }
    .print-order-total__label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .print-order-total__value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--brown-dark);
    }

    /* ── Diagram page header ─────────────────────────────────── */
    .print-page-header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      border-bottom: 2px solid var(--brown);
      padding-bottom: .5rem;
      margin-bottom: 1rem;
    }
    .print-page-header__member {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown);
    }
    .print-page-header__group {
      font-size: 0.82rem;
      color: #666;
    }
    .print-page-header__jobref {
      margin-left: auto;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* ── Pattern summary table (one row per distinct cutting pattern,       ── */
    /* ── replaces Genia's per-layout box — same facts, no per-layout repeat) */
    .print-pattern-table { margin-bottom: 1.25rem; }

    /* ── Horizontal cutting diagrams — wide bars stacked down the page,     ── */
    /* ── instead of narrow tall sticks wrapped side by side, to cut white   ── */
    /* ── space and give cut/elevation labels room to sit inline.           ── */
    .h-diagrams-container {
      display: flex;
      flex-direction: column;
      gap: .85rem;
    }
    .h-diagram__header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #666;
      margin-bottom: .25rem;
    }
    .h-diagram__header strong { color: var(--brown); font-size: 0.85rem; }
    .h-stick {
      display: flex;
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .h-stick .cut-segment,
    .h-stick .cut-segment-split,
    .h-stick .waste-segment {
      min-height: 0;
      height: 100%;
      flex-direction: column;
      border-bottom: none;
      border-top: none;
      border-right: 2px solid white;
      font-size: 0.66rem;
      line-height: 1.15;
      padding: 0 .25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .h-stick > *:last-child { border-right: none; }
    .h-seg-mark { opacity: .85; }

    /* ── Per-group stats bar ─────────────────────────────────── */
    .print-group-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5rem;
      margin-top: 1rem;
      padding: .65rem;
      background: var(--tan-bg);
      border-top: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .print-group-stats .stat { text-align: center; }

    /* ── Print media ─────────────────────────────────────────── */
    @media print {
      body { background: white; padding: 0; margin: 0; }

      .print-page {
        box-shadow: none;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 0;
      }

      .print-page--diagram   { break-before: page; }
      .print-page--ordersheet { break-before: page; }

      /* Stock table header repeats across physical pages */
      .print-stock-table thead { display: table-header-group; }
      .print-stock-table tr    { page-break-inside: avoid; }

      .stick-diagram        { page-break-inside: avoid; break-inside: avoid; }
      .diagrams-container   { page-break-inside: auto; }
      .h-diagram            { page-break-inside: avoid; break-inside: avoid; }
      .h-diagrams-container { page-break-inside: auto; }
      .print-pattern-table tr { page-break-inside: avoid; }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      @page { margin: 1.5cm; size: A4; }
    }
  </style>
</head>
<body>

  <div id="print-root"></div>

  {{ project.state|json_script:"print-state-data" }}
  {{ cladding_areas|json_script:"print-elevations-data" }}
  {{ extra_items|json_script:"print-extra-items-data" }}
  {{ product_prices|json_script:"print-product-prices-data" }}
  <script>
    window.CUTLIST_PRINT_MODE = true;
    window.CUTLIST_ELEVATIONS = JSON.parse(document.getElementById('print-elevations-data').textContent);
    window.CUTLIST_EXTRA_ITEMS = JSON.parse(document.getElementById('print-extra-items-data').textContent);
    window.CUTLIST_PRODUCT_PRICES = JSON.parse(document.getElementById('print-product-prices-data').textContent);
    window.CUTLIST_PROJECT_INFO = {
      name: "{{ project.name|escapejs }}",
      lbRef: "{{ project.project.lb_ref|escapejs }}",
      clientName: "{{ project.project.client_name|escapejs }}",
      siteAddress: "{{ project.project.site_address|escapejs }}",
      merchantReference: "{{ project.project.merchant_reference|escapejs }}"
    };
    (function () {
      const el = document.getElementById('print-state-data');
      window.CUTLIST_STATE = el ? JSON.parse(el.textContent) : null;
    })();
  </script>
  <script src="{% static 'js/cutlist.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const root = document.getElementById('print-root');

      if (!window.CUTLIST_STATE || !window.CUTLIST_STATE.tabs || !window.CUTLIST_STATE.tabs.length) {
        root.innerHTML = '<p style="padding:2cm;font-family:sans-serif">No saved data found. Please save the project before printing.</p>';
        return;
      }

      // Populate project state without touching wizard DOM
      const state = window.CUTLIST_STATE;
      Object.assign(project.jobDetails, state.jobDetails || {});
      project.tabs  = [];
      tabCounter    = 0;
      binIdCounter  = 0;

      state.tabs.forEach(tabData => {
        const tabId = `tab-${tabCounter++}`;
        const tab = {
          id:                   tabId,
          memberName:           tabData.memberName,
          productId:            tabData.productId ?? null,
          cuts:                 tabData.cuts,
          stockLengths:         tabData.stockLengths,
          cutTolerance:         tabData.cutTolerance !== undefined ? tabData.cutTolerance : 50,
          overlengthSplitStock: tabData.overlengthSplitStock || 6000,
          results:              tabData.results || null,
        };
        if (tab.results && tab.results.bins) {
          tab.results.bins.forEach(bin => {
            if (bin.id === undefined) bin.id = binIdCounter++;
          });
        }
        project.tabs.push(tab);
      });

      root.appendChild(buildSummaryPage());
      buildDiagramPages().forEach(page => root.appendChild(page));
      const orderSheetPage = buildOrderSheetPage();
      if (orderSheetPage) root.appendChild(orderSheetPage);

      setTimeout(() => window.print(), 600);
    });

    // ─── HTML escaping helper ─────────────────────────────────────

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ─── Summary page ─────────────────────────────────────────────

    function buildSummaryPage() {
      const jd   = project.jobDetails;
      const info = window.CUTLIST_PROJECT_INFO || {};
      const tabs = project.tabs.filter(t => t.results);
      const today = new Date().toLocaleDateString('en-AU', {
        day: '2-digit', month: 'short', year: 'numeric'
      });

      const page = document.createElement('div');
      page.className = 'print-page print-page--summary';
      page.innerHTML = `
        <div class="print-header">
          <h1>Cutlist Optimisation Report</h1>
          <div class="print-meta-grid">
            <span class="print-meta-label">Job:</span>          <span>${esc(info.lbRef)}</span>
            <span class="print-meta-label">Client:</span>        <span>${esc(info.clientName)}</span>
            <span class="print-meta-label">Site:</span>          <span>${esc(info.siteAddress)}</span>
            <span class="print-meta-label">Reference:</span>    <span>${esc(info.merchantReference)}</span>
            <span class="print-meta-label">Prepared by:</span>  <span>${esc(jd.preparedBy)}</span>
            <span class="print-meta-label">Date:</span>          <span>${today}</span>
            <span class="print-meta-label">Kerf width:</span>   <span>${jd.kerfWidth}mm</span>
          </div>
        </div>
        ${buildElevationsTable()}
        <div class="print-section-title">Optimisation Overview</div>
        ${buildOverviewTable(tabs)}
      `;
      return page;
    }

    function buildElevationsTable() {
      const elevations = window.CUTLIST_ELEVATIONS || [];
      if (!elevations.length) return '';

      const rows = elevations.map(e => `<tr>
        <td>${esc(e.label) || '—'}</td>
        <td>${esc(e.orientation)}</td>
        <td>${Number(e.width_m).toFixed(2)}</td>
        <td>${Number(e.height_m).toFixed(2)}</td>
        <td>${Number(e.area_m2).toFixed(2)}</td>
        <td>${esc(e.product) || '—'}</td>
      </tr>`).join('');

      return `
        <div class="print-section-title">Elevations</div>
        <table class="print-table print-elevations-table">
          <thead>
            <tr>
              <th>Area</th><th>Orientation</th>
              <th>Width (m)</th>
              <th>Height (m)</th>
              <th>Area (m²)</th>
              <th>Cladding</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function buildOverviewTable(tabs) {
      if (!tabs.length) return '<p>No optimised results found.</p>';

      let totalSticks    = 0;
      let totalStockMm   = 0;
      let totalCutMm     = 0;
      let totalWasteMm   = 0;

      const rows = tabs.map(tab => {
        const r = tab.results;
        totalSticks  += r.stockCount;
        totalStockMm += r.totalStockUsed;
        totalCutMm   += r.totalCutLength;
        totalWasteMm += Number(r.totalWaste);
        return `<tr>
          <td>${esc(tab.memberName)}</td>
          <td>${r.stockCount}</td>
          <td>${(r.totalStockUsed / 1000).toFixed(1)}</td>
          <td>${(r.totalCutLength  / 1000).toFixed(1)}</td>
          <td>${r.wastePercentage}%</td>
        </tr>`;
      }).join('');

      const totalWastePct = totalStockMm > 0
        ? ((totalWasteMm / totalStockMm) * 100).toFixed(1)
        : '0.0';

      return `<table class="print-table">
        <thead>
          <tr>
            <th>Member Type</th>
            <th style="text-align:right">Sticks</th>
            <th style="text-align:right">Stock (lin. m)</th>
            <th style="text-align:right">Cut Length (m)</th>
            <th style="text-align:right">Waste %</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>${totalSticks}</td>
            <td>${(totalStockMm / 1000).toFixed(1)}</td>
            <td>${(totalCutMm   / 1000).toFixed(1)}</td>
            <td>${totalWastePct}%</td>
          </tr>
        </tfoot>
      </table>`;
    }

    // ─── Order sheet (final page) ───────────────────────────────────
    // One merged table — every stock item from every tab's optimised result,
    // plus any extra items (scribers, mouldings, etc.) added on the cladding
    // job — each priced ($/lm from the linked product) and summed to a total.
    // Sits after the diagram pages, since it's the "what do I actually order
    // and what does it cost" answer, not part of the cutting instructions.

    function buildOrderSheetPage() {
      const tabs   = project.tabs.filter(t => t.results);
      const extras = window.CUTLIST_EXTRA_ITEMS || [];
      if (!tabs.length && !extras.length) return null;

      const prices = window.CUTLIST_PRODUCT_PRICES || {};
      const rows = [];
      let hasUnpriced = false;
      let grandTotal  = 0;

      tabs.forEach(tab => {
        const counts = {};
        tab.results.bins.forEach(bin => {
          const length = bin.stockLength / 1000;
          counts[length] = (counts[length] || 0) + 1;
        });
        const unitPrice = tab.productId != null ? prices[tab.productId] : undefined;
        Object.entries(counts).forEach(([lenStr, qty]) => {
          const length   = parseFloat(lenStr);
          const costEach = unitPrice !== undefined ? parseFloat(unitPrice) * length : null;
          const subtotal = costEach !== null ? costEach * qty : null;
          if (subtotal !== null) grandTotal += subtotal; else hasUnpriced = true;
          rows.push({ product: tab.memberName, length, qty, costEach, subtotal });
        });
      });

      extras.forEach(item => {
        const length = parseFloat(item.length_m);
        // "each" products price per piece — length doesn't factor into cost, only quantity does.
        const costEach = item.unit_price !== null
          ? (item.unit === 'each' ? parseFloat(item.unit_price) : parseFloat(item.unit_price) * length)
          : null;
        const subtotal = costEach !== null ? costEach * item.quantity : null;
        if (subtotal !== null) grandTotal += subtotal; else hasUnpriced = true;
        rows.push({ product: item.description, length, qty: item.quantity, costEach, subtotal });
      });

      rows.sort((a, b) => a.product.localeCompare(b.product) || b.length - a.length);

      const bodyRows = rows.map(r => `<tr>
        <td>${esc(r.product)}</td>
        <td>${r.length.toFixed(2)}</td>
        <td>${r.qty}</td>
        <td>${r.costEach !== null ? '$' + r.costEach.toFixed(2) : '—'}</td>
        <td>${r.subtotal !== null ? '$' + r.subtotal.toFixed(2) : '—'}</td>
      </tr>`).join('');

      const page = document.createElement('div');
      page.className = 'print-page print-page--ordersheet';
      page.innerHTML = `
        <div class="print-page-header">
          <span class="print-page-header__member">Order Summary</span>
        </div>
        <table class="print-table print-stock-table">
          <thead>
            <tr>
              <th>Product</th>
              <th style="text-align:right">Length (m)</th>
              <th style="text-align:right">Count</th>
              <th style="text-align:right">Cost ea.</th>
              <th style="text-align:right">Subtotal</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
        </table>
        <div class="print-order-total">
          ${hasUnpriced ? '<span class="print-order-total__note">Some items have no price in the active price book and are excluded from this total.</span>' : ''}
          <span class="print-order-total__label">Estimate Total</span>
          <span class="print-order-total__value">$${grandTotal.toFixed(2)}</span>
        </div>`;
      return page;
    }

    // ─── Diagram pages ────────────────────────────────────────────

    function buildDiagramPages() {
      const pages  = [];
      const info   = window.CUTLIST_PROJECT_INFO || {};
      const jobRef = [info.lbRef, info.name].filter(Boolean).join(' — ');

      project.tabs.filter(t => t.results).forEach(tab => {
        const { bins, kerfWidth } = tab.results;

        const groupOrder = [...new Set(bins.map(b => b.group || ''))].sort((a, b) => {
          if (a === '') return 1;
          if (b === '') return -1;
          return a.localeCompare(b);
        });
        const hasNamedGroups = groupOrder.some(k => k !== '');

        groupOrder.forEach(groupKey => {
          const groupBins = bins
            .filter(b => (b.group || '') === groupKey)
            .sort((a, b) => b.stockLength - a.stockLength || a.remaining - b.remaining);

          if (!groupBins.length) return;

          const groupLabel = groupKey
            ? groupKey
            : (hasNamedGroups ? 'Ungrouped' : null);

          // Per-group stats
          const stockTotal = groupBins.reduce((s, b) => s + b.stockLength, 0);
          const wasteTotal = groupBins.reduce((s, b) => s + (b.remaining || 0), 0);
          const cutTotal   = groupBins.reduce((s, b) =>
            s + b.cuts.reduce((cs, c) => cs + (typeof c === 'object' ? c.length : c), 0), 0);
          const wastePct   = stockTotal > 0
            ? ((wasteTotal / stockTotal) * 100).toFixed(1)
            : '0.0';

          const page = document.createElement('div');
          page.className = 'print-page print-page--diagram';

          const groupSubtitle = groupLabel
            ? `<span class="print-page-header__group">Group: ${esc(groupLabel)}</span>`
            : '';

          // Collapse physical sticks into distinct cutting patterns — a job can
          // easily produce dozens of sticks that are really only a handful of
          // repeated patterns. A wee summary table (one row per pattern) carries
          // the per-stick facts once, instead of Genia's repeated per-layout box,
          // and the horizontal diagrams below just show where things sit.
          const layouts = groupIdenticalLayouts(groupBins);

          page.innerHTML = `
            <div class="print-page-header">
              <span class="print-page-header__member">${esc(tab.memberName)}</span>
              ${groupSubtitle}
              <span class="print-page-header__jobref">${esc(jobRef)}</span>
            </div>
            ${buildPatternSummaryTable(layouts, kerfWidth)}
            <div class="h-diagrams-container"></div>
            <div class="print-group-stats">
              <div class="stat">
                <div class="stat-label">Sticks</div>
                <div class="stat-value">${groupBins.length}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Stock (lin. m)</div>
                <div class="stat-value">${(stockTotal / 1000).toFixed(1)}</div>
              </div>
              <div class="stat">
                <div class="stat-label">Cut Length</div>
                <div class="stat-value">${(cutTotal / 1000).toFixed(1)}m</div>
              </div>
              <div class="stat">
                <div class="stat-label">Waste</div>
                <div class="stat-value">${wastePct}%</div>
              </div>
            </div>`;

          const container = page.querySelector('.h-diagrams-container');
          layouts.forEach((layout, i) => {
            container.insertAdjacentHTML(
              'beforeend',
              generateHorizontalDiagram(layout.representative, `Pattern ${i + 1}`)
            );
          });

          pages.push(page);
        });
      });

      return pages;
    }

    // ─── Repetition grouping ────────────────────────────────────────
    // Two sticks count as "the same layout" if they share a stock length and
    // the same multiset of cut lengths, regardless of the order those cuts
    // happen to sit in on any one physical bin (two independently-produced
    // bins with identical cuts can end up in a different order). The
    // representative bin picked for the diagram has its cuts re-sorted
    // largest-to-smallest so every printed pattern reads consistently.

    function cutLengthOf(cut) {
      return typeof cut === 'object' ? (cut.displayLength ?? cut.length) : cut;
    }

    function groupIdenticalLayouts(bins) {
      const groups = new Map();
      bins.forEach(bin => {
        const lengths = bin.cuts.map(cutLengthOf).slice().sort((a, b) => b - a);
        const key = `${bin.stockLength}|${lengths.join(',')}`;
        if (!groups.has(key)) {
          const sortedCuts = [...bin.cuts].sort((a, b) => cutLengthOf(b) - cutLengthOf(a));
          groups.set(key, { representative: { ...bin, cuts: sortedCuts }, count: 0 });
        }
        groups.get(key).count += 1;
      });
      return Array.from(groups.values());
    }

    // ─── Pattern summary table ────────────────────────────────────
    // One row per distinct pattern — stock length, how many sticks use it,
    // number of saw cuts, kerf loss, and leftover remnant. All per-stick
    // (not multiplied by qty off), matching how Genia states these facts,
    // just consolidated into one table instead of a box repeated per layout.

    function buildPatternSummaryTable(layouts, kerfWidth) {
      const rows = layouts.map((layout, i) => {
        const rep      = layout.representative;
        const numCuts  = rep.cuts.length;
        const cutWaste = numCuts * kerfWidth;
        return `<tr>
          <td>Pattern ${i + 1}</td>
          <td>${rep.stockLength}mm</td>
          <td>${layout.count}</td>
          <td>${numCuts}</td>
          <td>${cutWaste}mm</td>
          <td>${rep.remaining || 0}mm</td>
        </tr>`;
      }).join('');

      return `<table class="print-table print-pattern-table">
        <thead>
          <tr>
            <th>Pattern</th>
            <th style="text-align:right">Stock Length</th>
            <th style="text-align:right">Qty off</th>
            <th style="text-align:right">Cuts</th>
            <th style="text-align:right">Cut Waste</th>
            <th style="text-align:right">Leftover</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    // ─── Horizontal cutting diagram (print-only) ───────────────────
    // A dedicated print-only renderer, deliberately separate from
    // generateCuttingDiagram() in cutlist.js — the interactive Step 4 editor
    // keeps its vertical sticks (needed for drag/drop and stick-length editing),
    // this only ever runs here. Widths are simple percentages of stock length;
    // print doesn't need the pixel-exact kerf-gap math the live editor does.

    function generateHorizontalDiagram(bin, label) {
      const { stockLength, cuts, remaining, timberType } = bin;
      const timberClass = timberType ? `timber-${timberType.toLowerCase()}` : 'timber-other';

      let segmentsHtml = '';
      cuts.forEach(cutInfo => {
        const isSplitPiece  = typeof cutInfo === 'object' ? cutInfo.isSplitPiece : false;
        const displayLength = typeof cutInfo === 'object' ? (cutInfo.displayLength ?? cutInfo.length) : cutInfo;
        const mark          = typeof cutInfo === 'object' ? (cutInfo.mark || '') : '';
        const cutClass      = isSplitPiece ? 'cut-segment-split' : 'cut-segment';
        const widthPct      = (displayLength / stockLength) * 100;
        segmentsHtml += `
          <div class="${cutClass}" style="width:${widthPct}%;" title="${esc(mark)}">
            <span>${displayLength}mm</span>
            ${mark ? `<span class="h-seg-mark">${esc(mark)}</span>` : ''}
          </div>`;
      });

      if (remaining > 0) {
        const wastePct = (remaining / stockLength) * 100;
        segmentsHtml += `
          <div class="waste-segment" style="width:${wastePct}%;">
            <span>${remaining}mm</span>
          </div>`;
      }

      return `
        <div class="h-diagram ${timberClass}">
          <div class="h-diagram__header"><strong>${esc(label)}</strong><span>${stockLength}mm stock</span></div>
          <div class="h-stick">${segmentsHtml}</div>
        </div>`;
    }
  </script>
</body>
</html>
