<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Report — {{ section.label }}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <style>
    body { background: #f0ede8; padding: 2cm 0; font-size: 13px; }

    .print-page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 24px auto;
      padding: 2cm;
      box-sizing: border-box;
      box-shadow: 0 2px 10px rgba(26,10,0,.12);
    }

    .print-header { border-bottom: 2px solid var(--brown); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .print-logo { height: 110px; width: auto; display: block; margin-bottom: .75rem; }
    .print-header h1 { font-size: 1.1rem; font-weight: 700; margin: 0 0 .6rem 0; color: var(--brown); letter-spacing: .02em; }
    .print-meta-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: .2rem .75rem; font-size: 0.8rem; }
    .print-meta-label { color: #888; font-weight: 600; }

    .print-section-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      color: #999; margin: 1.5rem 0 .5rem 0; padding-bottom: .25rem; border-bottom: 1px solid var(--border);
    }

    .board-columns { display: flex; gap: 1.5rem; }
    .board-columns table { flex: 1; min-width: 0; }

    .print-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 0.5rem; }
    .print-table thead th { background: var(--brown); color: white; font-weight: 600; padding: .35rem .65rem; text-align: left; }
    .print-table thead th.num { text-align: right; }
    .print-table td { padding: .3rem .65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    .print-table td.num { text-align: right; }
    .print-table tr:last-child td { border-bottom: none; }

    .print-order-total {
      display: flex; align-items: baseline; justify-content: flex-end; gap: .5rem;
      margin-bottom: 1.5rem; padding-top: .5rem; border-top: 2px solid var(--brown);
    }
    .print-order-total__label { font-size: 0.78rem; font-weight: 700; color: var(--brown); text-transform: uppercase; letter-spacing: .04em; }
    .print-order-total__value { font-size: 0.95rem; font-weight: 700; color: var(--brown-dark); margin-right: 1.25rem; }
    .print-order-total__value:last-child { margin-right: 0; }

    .no-print { text-align: center; margin-bottom: 1rem; }

    @media print {
      body { background: white; padding: 0; margin: 0; }
      .print-page { box-shadow: none; margin: 0; padding: 0; width: 100%; min-height: 0; }
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      @page { margin: 1.5cm; size: A4; }
    }
  </style>
</head>
<body>

  <div class="no-print" style="max-width:210mm;margin:0 auto 1rem auto;display:flex;justify-content:space-between;align-items:center;">
    <a href="{% url 'jobs:job_detail' job.pk %}">&larr; Back to estimate</a>
    <button type="button" class="btn btn-primary" onclick="window.print()">Print</button>
  </div>

  <div class="print-page">
    <div class="print-header">
      <img src="{% static 'Lumberbank-Primary-Logo.png' %}" alt="LumberBank" class="print-logo">
      <h1>Board Report</h1>
      <div class="print-meta-grid">
        <span class="print-meta-label">Job:</span>   <span>{{ job.project.lb_ref }}</span>
        <span class="print-meta-label">Part:</span>  <span>{{ section.label }}</span>
        <span class="print-meta-label">Client:</span><span>{{ job.project.client_name }}</span>
        <span class="print-meta-label">Date:</span>  <span>{% now "d M Y" %}</span>
      </div>
    </div>

    {% include 'jobs/_cladding_board_table.html' %}
  </div>

</body>
</html>
